name = "grovetools"
workspaces = ["*"]

[llm]
default_model = "gemini-3-pro-preview"

[skills]
# "pi" is required for the standing steward agent: without it .pi/skills never
# syncs and pi-family agents see no skills on disk (skills/pkg/skills/sync.go).
providers = ["claude", "pi"]
# "grove-steward" is the standing agent's operating doctrine. It composes
# grove-worktree-analyzer and grove-feature-coordinator-v2 BY REFERENCE, so
# those two must stay authorized here even though the steward job now names
# only grove-steward — an unauthorized skill cannot be invoked on demand.
use = ["grove-skill-builder", "grove-skill-maintainer", "grove-feature-coordinator", "grove-concept-maintainer", "concept-scoped-planner", "flow-context-tuner", "grove-feature-coordinator-v2", "grove-feature-subcoordinator", "grove-claude-settings-guide", "grove-feature-subcoordinator-agentic", "grove-worktree-analyzer", "grove-oracle-planner", "grove-oracle-contract-chain", "grove-inbox-triage", "grove-release-coordinator", "grove-oracle-implementer", "grove-satellite-debugger", "grove-demo-pilot", "grove-tui-pilot", "grove-tui-pilot-creator", "explain-with-analogy", "test-fibonacci-builder", "test-wordcount-analyzer", "grove-feature-pipeline", "grove-source-discovery", "grove-steward", "grove-perf-debugger", "grove-pi-oracle"]

# Claude Code: what the grovetools project itself needs (committed + portable).
# Personal/machine-wide rules — git, python, gcloud, defaultMode, sandbox, and
# the /Users/solair paths — live in the global fragment
# ~/.config/grove/claude-settings.toml. Arrays union down onto these.
[claude]
allowGroveTools = true   # grove ecosystem CLIs (grove, flow, cx, nb, tend, ...)

[claude.permissions]
allow = [
  "Bash(go:*)",
  "Bash(make:*)",
  "Bash(gofumpt:*)",
]

[claude.sandbox.network]
allowAllUnixSockets = true
allowLocalBinding = true
